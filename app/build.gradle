plugins {
    id 'com.android.application'
}

android {
    namespace 'com.smarteye.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.smarteye.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.4"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
